org.gradle.jvmargs=-Xmx4G -Djdk.tls.client.protocols=TLSv1.2 -Dhttps.protocols=TLSv1.2
systemProp.jdk.tls.client.protocols=TLSv1.2
systemProp.https.protocols=TLSv1.2
# The build host is on a flaky Wi-Fi link; retry dependency downloads harder.
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=1000
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=120000
org.gradle.parallel=true
org.gradle.caching=true
